apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: prodvs-vm
  namespace: prodvs
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/domain: prodvs-vm
    spec:
      domain:
        cpu:
          cores: 1
        devices:
          disks:
            - disk:
                bus: virtio
              name: containerdisk
          interfaces:
            - masquerade: {}
              name: default
        resources:
          requests:
            memory: 512Mi
      networks:
        - name: default
          pod: {}
      volumes:
        - containerDisk:
            image: quay.io/kubevirt/cirros-container-disk-demo:latest
          name: containerdisk
